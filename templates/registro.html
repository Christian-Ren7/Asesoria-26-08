<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Asesoría</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>
<body>

    <main class="pagina-acceso">
        <section class="contenedor-acceso">

            <h1>Crear cuenta</h1>
            <p class="texto-acceso">
                Regístrate para acceder a nuestros servicios.
            </p>

            {% if mensaje_estado %}
                <p class="mensaje-acceso mensaje-exito">
                    {{ mensaje_estado }}
                </p>
            {% endif %}

            {% if error_estado %}
                <p class="mensaje-acceso mensaje-error">
                    {{ error_estado }}
                </p>
            {% endif %}

            <form
                class="formulario-acceso"
                action="{{ url_for('registro') }}"
                method="POST"
            >
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre completo"
                    autocomplete="name"
                    required
                >

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo electrónico"
                    autocomplete="email"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Crea una contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">Crear cuenta</button>
            </form>

            <p class="enlace-acceso">
                ¿Ya tienes una cuenta?
                <a href="{{ url_for('login') }}">Iniciar sesión</a>
            </p>

            <p class="enlace-acceso">
                <a href="{{ url_for('inicio') }}">Volver al inicio</a>
            </p>

        </section>
    </main>

</body>
</html>
